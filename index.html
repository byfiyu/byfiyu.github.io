<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Karya</title>
    <style>
        /* Pengaturan Font dan Latar Belakang */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            margin: 0;
            padding: 0;
            color: #262626;
        }
        .container {
            max-width: 935px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* Bagian Header / Profil ala Instagram */
        .profile-header {
            display: flex;
            align-items: center;
            margin-bottom: 44px;
        }
        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: #ddd;
            margin-right: 50px;
            object-fit: cover;
            /* Proteksi foto profil */
            pointer-events: none;
            -webkit-user-drag: none;
        }
        .profile-info h1 {
            font-weight: 300;
            font-size: 28px;
            margin: 0 0 15px 0;
        }
        .profile-bio {
            font-size: 16px;
            line-height: 1.5;
        }
        .profile-bio a {
            color: #00376b;
            text-decoration: none;
            font-weight: bold;
        }
        
        /* Grid Galeri (3 Kolom) */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
        }
        /* Penyesuaian untuk layar HP */
        @media (max-width: 768px) {
            .gallery-grid {
                gap: 3px;
            }
            .profile-header {
                flex-direction: column;
                text-align: center;
            }
            .profile-pic {
                margin: 0 auto 20px auto;
                width: 100px;
                height: 100px;
            }
        }
        
        /* Pengaturan Tiap Kotak Gambar */
        .gallery-item {
            position: relative;
            width: 100%;
            padding-bottom: 100%; /* Memaksa bentuk kotak sempurna rasio 1:1 */
            background-color: #efefef;
        }
        .gallery-item img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Gambar akan terpotong rapi memenuhi kotak */
            
            /* -- KODE PROTEKSI GAMBAR UTAMA -- */
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            user-drag: none;
            -webkit-touch-callout: none; /* Mati di iOS */
            pointer-events: none; /* Mencegah klik dan tekan-tahan */
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- BAGIAN PROFIL -->
        <div class="profile-header">
            <!-- Ubah "foto-profil.jpg" dengan nama file foto Anda -->
            <img src="foto-profil.jpg" alt="Foto Profil" class="profile-pic">
            
            <div class="profile-info">
                <!-- Ubah dengan nama pengguna (username) Anda -->
                <h1>@kreator_visual</h1>
                <div class="profile-bio">
                    <strong>Nama Anda</strong><br>
                    Digital Artist | Character Designer <br>
                    Eksplorasi visual Komodore Kipasu & artwork ROCKFESTiVA.<br>
                    <a href="https://instagram.com/akunanda">Hubungi Saya</a>
                </div>
            </div>
        </div>

        <!-- BAGIAN GRID KARYA -->
        <div class="gallery-grid">
            
            <!-- Karya 1 -->
            <div class="gallery-item">
                <img src="karya1.jpg" alt="Artwork 1">
            </div>
            
            <!-- Karya 2 -->
            <div class="gallery-item">
                <img src="karya2.jpg" alt="Artwork 2">
            </div>
            
            <!-- Karya 3 -->
            <div class="gallery-item">
                <img src="karya3.jpg" alt="Artwork 3">
            </div>

            <!-- Karya 4 -->
            <div class="gallery-item">
                <img src="karya4.jpg" alt="Artwork 4">
            </div>

            <!-- Karya 5 -->
            <div class="gallery-item">
                <img src="karya5.jpg" alt="Artwork 5">
            </div>

            <!-- Karya 6 -->
            <div class="gallery-item">
                <img src="karya6.jpg" alt="Artwork 6">
            </div>
            
            <!-- Anda bisa menambah "gallery-item" lagi ke bawah jika karyanya banyak -->

        </div>
    </div>

    <!-- SCRIPT PROTEKSI TAMBAHAN -->
    <script>
        // 1. Mematikan klik kanan (Context Menu)
        document.addEventListener('contextmenu', event => event.preventDefault());

        // 2. Mematikan tombol pintasan untuk intip kode (Opsional tapi disarankan)
        document.onkeydown = function(e) {
            if(event.keyCode == 123) { return false; } // Mencegah tombol F12
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { return false; } // Ctrl+Shift+I
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) { return false; } // Ctrl+Shift+C
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { return false; } // Ctrl+Shift+J
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { return false; } // Ctrl+U (View Source)
        }
    </script>
</body>
</html>
