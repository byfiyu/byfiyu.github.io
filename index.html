<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Karya - @byfiyu</title>
    <style>
        /* CSS Dasar & Reset */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fafafa;
            margin: 0;
            padding: 0;
            color: #262626;
        }
        .container {
            max-width: 935px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* Header Profil Bergaya Instagram */
        .profile-header {
            display: flex;
            align-items: center;
            margin-bottom: 44px;
        }
        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: #ddd;
            margin-right: 50px;
            object-fit: cover;
            /* Proteksi Foto Profil */
            pointer-events: none;
            -webkit-user-drag: none;
        }
        .profile-info h1 {
            font-weight: 300;
            font-size: 28px;
            margin: 0 0 15px 0;
        }
        .profile-bio {
            font-size: 16px;
            line-height: 1.5;
        }
        .profile-bio a {
            color: #00376b;
            text-decoration: none;
            font-weight: bold;
        }
        
        /* Grid Galeri (3 Kolom Desktop, 3 Kolom Rapat di HP) */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
        }
        @media (max-width: 768px) {
            .gallery-grid { gap: 3px; }
            .profile-header { flex-direction: column; text-align: center; }
            .profile-pic { margin: 0 auto 20px auto; width: 100px; height: 100px; }
        }
        
        .gallery-item {
            position: relative;
            width: 100%;
            padding-bottom: 100%; /* Rasio Persegi 1:1 */
            background-color: #efefef;
            cursor: pointer;
            overflow: hidden;
        }
        .gallery-item img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.2s ease;
            
            /* Proteksi Gambar di Grid */
            -webkit-user-drag: none;
            user-drag: none;
            -webkit-touch-callout: none;
        }
        .gallery-item:hover img {
            transform: scale(1.03); /* Efek perbesaran halus saat kursor di atasnya */
        }

        /* Pop-up Modal (Lightbox & Deskripsi) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
        }
        .modal-container {
            background: #fff;
            max-width: 800px;
            width: 90%;
            max-height: 85vh;
            border-radius: 8px;
            display: flex;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        @media (max-width: 700px) {
            .modal-container {
                flex-direction: column;
                max-height: 90vh;
                overflow-y: auto;
            }
        }
        .modal-image-box {
            background: #000;
            flex: 1.2;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .modal-image-box img {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            /* Proteksi Gambar Pop-up */
            pointer-events: none;
            -webkit-user-drag: none;
            user-select: none;
        }
        .modal-info-box {
            flex: 1;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        .modal-title {
            font-size: 22px;
            margin: 0 0 10px 0;
            font-weight: 600;
        }
        .modal-desc {
            font-size: 15px;
            line-height: 1.6;
            color: #444;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #888;
            cursor: pointer;
            z-index: 1001;
        }
        .close-btn:hover { color: #000; }
    </style>
</head>
